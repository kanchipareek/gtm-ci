# offline-gate scores the Play's output on every pull request. It costs 0
# credits and does not install the deepline CLI.
# plays-check is Deepline's own validation: the file is valid
# code, and the check stops before a cloud run. It needs the API key, so
# a fork pull request is skipped.
# live-eval runs the real Play only when the pull request has the label
# live-eval, and only when the branch is in this repo. Forks get no secrets.

name: gtm-ci

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]

# contents: read is enough to check out both commits.
# pull-requests: write lets this job's GITHUB_TOKEN create and edit the
# one pull request comment. A personal token is not used.
# actions: write is for the results artifact. Naming any permission turns
# the others off, and the upload step cannot store a file without this one.
permissions:
  contents: read
  pull-requests: write
  actions: write

jobs:
  offline-gate:
    name: offline-gate
    # GitHub's hosted Linux runner. The laptop is Windows. The check runs
    # here so every pull request is scored on the same machine.
    # A public repo does not spend Actions minutes. A private repo uses
    # the account's free minutes.
    # opened, synchronize, and reopened always run. A label edit runs
    # only for live-eval or test-set-change. Those two are the labels
    # this workflow reads. Any other label must not start a run.
    if: >-
      ${{
        (github.event.action != 'labeled' && github.event.action != 'unlabeled') ||
        github.event.label.name == 'live-eval' ||
        github.event.label.name == 'test-set-change'
      }}
    runs-on: ubuntu-latest
    steps:
      # The pull request's own commit, in head/. head.sha is that commit.
      # The default checkout is GitHub's synthetic merge of base into the
      # pull request, which is not the proposed tree. The head repo is set
      # so a fork pull request still checks out the fork's commit.
      # Only this copy's fixtures, scorer, and scripts are used below.
      - name: Check out the pull request head
        uses: actions/checkout@v4
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.sha }}
          path: head

      # base.sha is the tip of the branch the pull request targets, usually
      # main, at the time of this event. That tree is the "before".
      # The gate uses this copy for plays/ only. An old scorer or an old
      # answer key in this folder is not what grades the pull request.
      - name: Check out the base commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: base

      # Node 22 runs the offline runner (npx tsx). It does not run Deepline.
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      # The scorer is Python 3.11, the same version as the laptop.
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # tsx is a dev dependency. npm ci installs the lockfile, including it,
      # into head/node_modules. The offline runner is started from head/.
      - name: Install Node packages
        working-directory: head
        run: npm ci

      # Editable install of the head scorer. Later steps run python -m scorer
      # from head/, and the package root is this checkout, so results land
      # in head/results and the default fixtures file is head/fixtures.
      - name: Install the scorer
        run: pip install -e head/

      # Score the base plays with the head scorer and the head fixtures.
      # The working directory is head/, so the default fixtures path is
      # head/fixtures/events.jsonl. ../base/plays is the only base input.
      # Both sides have to be graded by the same scorer. If base used its
      # own old scorer, a pull request could change the grader instead of
      # the rules and still look green.
      - name: Score the base plays
        id: score-base
        working-directory: head
        run: python -m scorer --mode offline --label base --plays ../base/plays

      # The same command on the pull request's own plays/. This is the "after".
      - name: Score the head plays
        id: score-head
        working-directory: head
        run: python -m scorer --mode offline --label head --plays plays

      # Hash fixtures/ and ci/thresholds.json on both checkouts. Exit 1 when
      # they differ and the pull request has no test-set-change label.
      # A changed answer key would make the two scores above agree, so the
      # compare step would not see it. Labels come from the event. An empty
      # list is fine: the guard then treats the pull request as unlabelled.
      - name: Guard the test set
        id: guard
        working-directory: head
        env:
          PR_LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
        run: python -m scorer.guard ../base . --labels "$PR_LABELS"

      # Write head/results/comment.md and exit 1 when a threshold breaks.
      # success() || failure() keeps this step running after a guard failure,
      # so the comment file exists for a red pull request. A cancelled job
      # skips it. The score outcomes skip it when a score step failed,
      # because there is no pair of result files to compare. Exit 1 fails
      # the job. There is no continue-on-error.
      - name: Compare base and head
        if: ${{ (success() || failure()) && steps.score-base.outcome == 'success' && steps.score-head.outcome == 'success' }}
        working-directory: head
        run: python -m scorer.compare results/base.json results/head.json --out results/comment.md

      # The compare verdict only judges the scores. Put the guard's line
      # at the top of the comment too, so a red guard never sits next to
      # "Passed" with no reason given. Exits 0. The guard step above
      # already set the job result.
      - name: Add the guard line to the comment
        if: ${{ (success() || failure()) && hashFiles('head/results/comment.md') != '' }}
        working-directory: head
        env:
          PR_LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
        run: python -m scorer.guard ../base . --labels "$PR_LABELS" --comment results/comment.md

      # Test the test set. The head rules are broken on purpose, one edit
      # at a time from ci/mutations.json, and scored on the base test set
      # and on the head test set. Only the fixtures differ, so a lower head
      # score means this pull request's test set change lets more rule
      # breaks through. The test-set-change label approves a change to the
      # answers. This section shows the reviewer what that change costs.
      # Shown, not gated: continue-on-error, so it never fails the job.
      # --allow-stale because a pull request may change a line a mutation
      # edits. Those are listed as not applied. 0 credits.
      - name: Score the test set strength
        if: ${{ (success() || failure()) && hashFiles('head/results/comment.md') != '' }}
        continue-on-error: true
        working-directory: head
        run: |
          python -m scorer.mutate --allow-stale --fixtures ../base/fixtures/events.jsonl --out results/mutation_base > /dev/null
          python -m scorer.mutate --allow-stale --out results/mutation_head > /dev/null
          python -m scorer.mutate --section results/mutation_base.json results/mutation_head.json --comment results/comment.md

      # Keep the score files and the comment. always() so a failing guard
      # or compare still uploads them. The folder is head/results because
      # that is the scorer package root, not the runner's top directory.
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: results
          path: head/results/

      # List the pull request comments, edit the one that starts with
      # <!-- gtm-ci -->, or create it if this is the first run.
      # always() so the comment is posted even when guard or compare exits 1.
      # A red pull request is when the reviewer needs the numbers.
      # GITHUB_REPOSITORY is already set by the runner. It is the repo that
      # owns the pull request, so the comment lands on the base repo.
      # gh is already installed on the runner. The token is an env var, not
      # a command argument, so the log does not print it.
      - name: Post the pull request comment
        if: always()
        working-directory: head
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: python scripts/post_comment.py results/comment.md

  plays-check:
    name: plays-check
    # A fork pull request must not receive the API key. head.repo is the
    # fork. github.repository is this repo. They match only for a branch
    # that already lives here. Deepline's own workflow skips forks the same way.
    # The check is free and it does not run the Play.
    # Same label filter as offline-gate, so an unrelated label does not
    # install the CLI. A fork is still skipped.
    if: >-
      ${{
        github.event.pull_request.head.repo.full_name == github.repository &&
        (
          (github.event.action != 'labeled' && github.event.action != 'unlabeled') ||
          github.event.label.name == 'live-eval' ||
          github.event.label.name == 'test-set-change'
        )
      }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out the pull request head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      # Pinned CLI version, so a CLI release cannot change the check.
      - name: Install the pinned Deepline CLI
        run: npm install --global deepline@0.3.535

      # Headless auth is the env var. The official workflow also
      # sets the host. The key comes from the repository secret. It is not
      # printed. plays check stops before a cloud run.
      - name: Check the Play
        env:
          DEEPLINE_API_KEY: ${{ secrets.DEEPLINE_API_KEY }}
          DEEPLINE_HOST_URL: https://code.deepline.com
        run: deepline plays check plays/champion-tracker.play.ts

  live-eval:
    name: live-eval
    # After the gate, so the comment file already exists and this job can
    # append to it. !cancelled() still runs when the gate failed. Alert
    # counts are not this job's pass rule.
    # The label filter matches the other jobs. Removing live-eval still
    # skips this job, because the pull request no longer has that label.
    needs: offline-gate
    if: >-
      ${{
        !cancelled() &&
        contains(github.event.pull_request.labels.*.name, 'live-eval') &&
        github.event.pull_request.head.repo.full_name == github.repository &&
        (
          (github.event.action != 'labeled' && github.event.action != 'unlabeled') ||
          github.event.label.name == 'live-eval' ||
          github.event.label.name == 'test-set-change'
        )
      }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out the pull request head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: head

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # Same pin as plays-check. The scorer shells out to this CLI.
      - name: Install the pinned Deepline CLI
        run: npm install --global deepline@0.3.535

      - name: Install the scorer
        run: pip install -e head/

      # The cap is the number in ci/thresholds.json, not a copy of it here.
      # A later edit to live_max_credits is what this job spends up to.
      - name: Read the live credit cap
        id: cap
        working-directory: head
        run: python -c "import json; from pathlib import Path; data = json.loads(Path('ci/thresholds.json').read_text(encoding='utf-8')); print('credits=' + str(data['live_max_credits']))" >> "$GITHUB_OUTPUT"

      # --yes skips the keyboard question. There is no person on the runner.
      # The command exits 0 when the run finished, including when the bill
      # is over the cap or some company fields drifted. The cap check is
      # the last step, after the comment has been updated. A failed run
      # exits here and the later steps do not run.
      - name: Run the live Play
        working-directory: head
        env:
          DEEPLINE_API_KEY: ${{ secrets.DEEPLINE_API_KEY }}
          DEEPLINE_HOST_URL: https://code.deepline.com
        run: python -m scorer --mode live --yes --fixtures fixtures/live_companies.json --max-credits ${{ steps.cap.outputs.credits }}

      # The gate uploaded head/results, which contains comment.md.
      # continue-on-error so a missing artifact does not fail this job.
      # The job fails only when the run failed or the credits are over the cap.
      - name: Download the gate comment
        id: gate-comment
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: results
          path: gate-results

      - name: Append the Live run section
        working-directory: head
        run: python -m scorer.drift results/live.json --comment ../gate-results/comment.md

      # hashFiles is empty when the gate did not leave a comment. Posting
      # a body that is only the live section would replace the old comment.
      - name: Post the pull request comment
        if: ${{ success() && hashFiles('gate-results/comment.md') != '' }}
        working-directory: head
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: python scripts/post_comment.py ../gate-results/comment.md

      # Greater than the cap. Equal to the cap still passes. "unknown"
      # is not treated as 0 and does not fail the job.
      - name: Fail if credits are over the cap
        working-directory: head
        run: python -m scorer.drift results/live.json --cap ${{ steps.cap.outputs.credits }} --check-cap

      - name: Upload the live result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-results
          path: head/results/live.json
          if-no-files-found: ignore
