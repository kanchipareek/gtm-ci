[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gtm-ci"
version = "0.0.1"
description = "CI for a Deepline Play: score each pull request on synthetic job-change events and block it if false alerts go up. Scaffold only; nothing is built yet."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pytest>=8.3.3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.setuptools.packages.find]
include = ["scorer*"]
